<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
  background: #87CEEB;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  user-select: none;
}

.card {
  background: #FFFDF0;
  border-radius: 24px;
  padding: 20px 16px 16px;
  width: 100%;
  max-width: 400px;
  border: 4px solid #F5A623;
  box-shadow: 0 8px 0 #c8810a, 0 12px 30px rgba(0,0,0,0.15);
}

h1 { text-align: center; font-size: 1.8rem; color: #1A1A2E; margin-bottom: 12px; }

.score-bar {
  display: flex;
  justify-content: space-around;
  background: #FFD200;
  border-radius: 12px;
  padding: 6px 8px;
  margin-bottom: 12px;
  border: 3px solid #F5A623;
}
.score-item { text-align: center; font-size: 0.7rem; font-weight: bold; color: #1A1A2E; }
.score-item b { font-size: 1.3rem; display: block; }

.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 10px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; border: 2px solid #bbb; transition: all 0.3s; }
.dot.cur  { background: #FFD200; border-color: #F5A623; transform: scale(1.3); }
.dot.ok   { background: #4CAF50; border-color: #388e3c; }
.dot.part { background: #FF9800; border-color: #e65100; }
.dot.miss { background: #FF5252; border-color: #c62828; }

.listen-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
  margin-bottom: 4px;
}
.listen-btn {
  flex: 1;
  padding: 12px;
  background: #FFD200;
  border: 4px solid #1A1A2E;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1.3rem;
  color: #1A1A2E;
  cursor: pointer;
  box-shadow: 4px 4px 0 #1A1A2E;
  transition: transform 0.1s, box-shadow 0.1s;
}
.listen-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #1A1A2E; }
.voice-sel {
  width: 90px;
  border: 3px solid #1A1A2E;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.65rem;
  color: #1A1A2E;
  background: #fff;
  padding: 4px 4px;
  cursor: pointer;
  box-shadow: 3px 3px 0 #1A1A2E;
}
.voice-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.voice-label { font-size: 1rem; }
.voice-select {
  flex: 1;
  padding: 6px 8px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.8rem;
  color: #1A1A2E;
  background: white;
  outline: none;
  cursor: pointer;
}
.voice-select:focus { border-color: #F5A623; }
.hint { text-align: center; font-size: 0.7rem; color: #bbb; margin-bottom: 12px; }

.answer-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 8px;
  min-height: 72px;
  align-items: center;
}
.abox {
  width: 60px; height: 68px;
  border: 4px solid #ddd;
  border-radius: 14px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: #1A1A2E;
  transition: border-color 0.2s, background 0.2s;
}
.abox.active  { border-color: #F5A623; background: #fffbea; box-shadow: 0 0 0 3px rgba(245,166,35,0.3); }
.abox.filled  { border-color: #F5A623; background: #fffbea; }
.abox.correct { border-color: #4CAF50; background: #e8f5e9; animation: pop 0.3s ease; }
.abox.wrong   { border-color: #FF5252; background: #ffebee; animation: shake 0.4s ease; }

.stars {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 6px;
  font-size: 1.2rem;
}
.star { opacity: 0.2; transition: opacity 0.3s, transform 0.3s; }
.star.lit { opacity: 1; transform: scale(1.3) rotate(10deg); }

.feedback {
  text-align: center;
  min-height: 32px;
  font-size: 1.1rem;
  margin-bottom: 8px;
  color: #1A1A2E;
}
.feedback.ok   { color: #2e7d32; }
.feedback.fail { color: #c62828; }
.fb-def { display: block; font-size: 0.95rem; color: #444; margin-top: 4px; font-weight: normal; line-height: 1.4; }

/* Keyboard */
.keyboard { display: flex; flex-direction: column; gap: 6px; }
.kb-row { display: flex; justify-content: center; gap: 5px; }

.key {
  min-width: 32px;
  height: 46px;
  padding: 0 4px;
  background: white;
  border: 3px solid #ccc;
  border-radius: 10px;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: bold;
  color: #1A1A2E;
  cursor: pointer;
  box-shadow: 0 3px 0 #aaa;
  transition: transform 0.08s, box-shadow 0.08s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  max-width: 46px;
}
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 #aaa; background: #f0f0f0; }

.key.del {
  background: #FF5252;
  border-color: #c62828;
  color: white;
  box-shadow: 0 3px 0 #8b0000;
  max-width: 60px;
  font-size: 1rem;
}
.key.del:active { box-shadow: 0 1px 0 #8b0000; }

.key.go {
  background: #4CAF50;
  border-color: #388e3c;
  color: white;
  box-shadow: 0 4px 0 #1b5e20;
  max-width: none;
  width: 100%;
  font-size: 1.3rem;
  height: 52px;
}
.key.go:active { box-shadow: 0 1px 0 #1b5e20; transform: translateY(3px); }

.key.nxt {
  background: #1A1A2E;
  border-color: #000;
  color: #FFD200;
  box-shadow: 0 4px 0 #000;
  max-width: none;
  width: 100%;
  font-size: 1.3rem;
  height: 52px;
}
.key.nxt:active { box-shadow: 0 1px 0 #000; transform: translateY(3px); }

.key.off { opacity: 0.3; pointer-events: none; }

/* Results */
.results { display: none; text-align: center; }
.results.show { display: block; }
.game.hide { display: none; }
.r-title { font-size: 1.8rem; color: #1A1A2E; margin-bottom: 8px; }
.r-score { font-size: 4.5rem; color: #F5A623; line-height: 1; text-shadow: 4px 4px 0 #1A1A2E; }
.r-sub { font-size: 0.9rem; color: #666; margin: 8px 0 6px; }
.r-points { font-size: 1.5rem; font-weight: bold; color: #1A1A2E; background: #FFD200; border: 3px solid #F5A623; border-radius: 12px; padding: 6px 20px; display: inline-block; margin-bottom: 10px; }
.r-stars { font-size: 2rem; margin-bottom: 16px; }
.play-again {
  padding: 14px 40px;
  background: #1A1A2E;
  color: #FFD200;
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1.3rem;
  cursor: pointer;
  box-shadow: 0 5px 0 #000;
  transition: transform 0.1s, box-shadow 0.1s;
}
.play-again:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }

.review {
  margin-bottom: 16px;
  text-align: left;
}
.review-title {
  font-size: 0.85rem;
  color: #999;
  text-align: center;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 10px;
  font-weight: bold;
}
.review-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff3f3;
  border: 3px solid #FF5252;
  border-radius: 16px;
  padding: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.review-img-wrap {
  width: 72px;
  height: 72px;
  border-radius: 14px;
  overflow: hidden;
  flex-shrink: 0;
  background: #fff8e1;
  border: 3px solid #FFD200;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
}
.review-info {
  flex: 1;
  min-width: 0;
}
.review-emoji { font-size: 1.2rem; }
.review-word {
  font-size: 1.5rem;
  font-weight: bold;
  color: #c62828;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.review-desc {
  font-size: 0.75rem;
  color: #555;
  margin-top: 2px;
  line-height: 1.3;
}
.review-listen {
  background: #FFD200;
  border: 3px solid #1A1A2E;
  border-radius: 10px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 2px 2px 0 #1A1A2E;
  flex-shrink: 0;
  transition: transform 0.1s, box-shadow 0.1s;
}
.review-listen:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #1A1A2E; }

.cw { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }

.level-select { display: none; padding: 8px 4px 16px; }
.level-select.show { display: block; }
.level-btn {
  display: flex; flex-direction: column; align-items: center;
  width: 100%; padding: 14px 12px; margin-bottom: 10px;
  border: 4px solid #1A1A2E; border-radius: 16px;
  font-family: inherit; font-size: 1.3rem; font-weight: bold;
  color: #1A1A2E; cursor: pointer;
  box-shadow: 4px 4px 0 #1A1A2E;
  transition: transform 0.1s, box-shadow 0.1s;
}
.level-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #1A1A2E; }
.level-btn span { font-size: 0.75rem; font-weight: normal; margin-top: 2px; }
.level-btn.bronze { background: #f4c97a; }
.level-btn.silver { background: #c8d8e8; }
.level-btn.gold   { background: #FFD200; }
.level-btn.plat   { background: #d4b8ff; }
.record-btn {
  display: block; width: 100%; padding: 12px;
  background: #fff; border: 3px dashed #aaa; border-radius: 14px;
  font-family: inherit; font-size: 1rem; color: #555; cursor: pointer;
  margin-top: 6px; transition: background 0.15s;
}
.record-btn:active { background: #f0f0f0; }

.records-screen { display: none; padding: 4px 4px 16px; }
.records-screen.show { display: block; }
.best-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 14px;
}
.best-card {
  border-radius: 14px; padding: 10px 8px; text-align: center;
  border: 3px solid #1A1A2E; box-shadow: 3px 3px 0 #1A1A2E;
}
.best-card .bc-level { font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; }
.best-card .bc-score { font-size: 1.6rem; font-weight: bold; line-height: 1; }
.best-card .bc-label { font-size: 0.65rem; color: #666; }
.best-card.bronze { background: #f4c97a; }
.best-card.silver { background: #c8d8e8; }
.best-card.gold   { background: #FFD200; }
.best-card.plat   { background: #d4b8ff; }
.history-title { font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 6px; }
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 10px; border-radius: 10px; background: #f7f7f7;
  border: 2px solid #eee; margin-bottom: 5px; font-size: 0.85rem;
}
.history-item .hi-level { font-weight: bold; }
.history-item .hi-pts { font-size: 1rem; font-weight: bold; color: #F5A623; }
.history-item .hi-date { font-size: 0.7rem; color: #999; }

.countdown-wrap {
  margin-top: 10px;
  height: 8px;
  background: #eee;
  border-radius: 99px;
  overflow: hidden;
}
.countdown-bar {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #4CAF50, #FFD200);
  width: 100%;
  transform-origin: left;
  animation: shrink 1.3s linear forwards;
}
.countdown-bar.fail {
  background: linear-gradient(90deg, #FF5252, #FF9800);
}

@keyframes shrink {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0); }
}
@keyframes slideOut {
  0%   { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(-40px); }
}
@keyframes slideIn {
  0%   { opacity: 0; transform: translateX(40px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes fall  { 0% { opacity:1; transform:translateY(0) rotate(0deg); } 100% { opacity:0; transform:translateY(100vh) rotate(720deg); } }
@keyframes pop   { 0% { transform:scale(0.8); } 60% { transform:scale(1.15); } 100% { transform:scale(1); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
</style>
</head>
<body>

<div class="cw" id="cw"></div>

<div class="card">
  <div class="game hide" id="game">
    <h1>&#x1F41D; Spelling Bee!</h1>

    <div class="score-bar">
      <div class="score-item">Score<b id="sScore">0</b></div>
      <div class="score-item">Streak<b id="sStreak">0</b></div>
      <div class="score-item">Word<b id="sWord">1/10</b></div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="listen-row">
      <button class="listen-btn" onclick="speak()">&#x1F50A; Listen!</button>
      <select id="voiceSel" class="voice-sel" onchange="speak()"></select>
    </div>
    <p class="hint">Tap to hear the word, then spell it!</p>

    <div class="answer-row" id="arow"></div>

    <div class="stars">
      <span class="star" id="st1">&#11088;</span>
      <span class="star" id="st2">&#11088;</span>
      <span class="star" id="st3">&#11088;</span>
    </div>

    <div class="feedback" id="fb"></div>

    <div class="keyboard" id="kb"></div>
    <div class="countdown-wrap" id="cdWrap">
      <div class="countdown-bar" id="cdBar" style="transform:scaleX(0)"></div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="r-title" id="rTitle">Great Job!</div>
    <div class="r-score" id="rScore">0/10</div>
    <div class="r-sub">words spelled correctly!</div>
    <div class="r-points" id="rPoints"></div>
    <div class="r-stars" id="rStars"></div>
    <div class="review" id="review"></div>
    <button class="play-again" onclick="showLevelSelect()">&#x1F41D; Play Again!</button>
  </div>

  <div class="level-select show" id="levelSelect">
    <h1>&#x1F41D; Spelling Bee!</h1>
    <p style="text-align:center;margin-bottom:14px;font-size:1rem;color:#555;">Choose your level!</p>
    <button class="level-btn bronze"  onclick="startLevel('Bronze')" >🥉 Bronze<span>Short &amp; simple words</span></button>
    <button class="level-btn silver"  onclick="startLevel('Silver')" >🥈 Silver<span>A little longer</span></button>
    <button class="level-btn gold"    onclick="startLevel('Gold')"   >🥇 Gold<span>Getting tricky!</span></button>
    <button class="level-btn plat"    onclick="startLevel('Platinum')">💎 Platinum<span>Super challenge!</span></button>
    <button class="record-btn" onclick="showRecords()">🏆 Records</button>
  </div>

  <div class="records-screen" id="recordsScreen">
    <h1 style="text-align:center;margin-bottom:12px;">🏆 Records</h1>
    <div id="recordsBest"></div>
    <div id="recordsHistory"></div>
    <button class="play-again" style="margin-top:16px;" onclick="showLevelSelect()">← Back</button>
  </div>
</div>

// --- Score storage (localStorage) ---
function saveScore(level, pts, correct) {
  try {
    var data = JSON.parse(localStorage.getItem('sbScores') || '[]');
    var now = new Date();
    var mm = now.getMonth()+1, dd = now.getDate();
    var dateStr = mm + '/' + dd;
    data.push({level: level, pts: pts, correct: correct, date: dateStr});
    if (data.length > 50) data = data.slice(-50); // keep last 50
    localStorage.setItem('sbScores', JSON.stringify(data));
  } catch(e) {}
}

function getScores() {
  try { return JSON.parse(localStorage.getItem('sbScores') || '[]'); } catch(e) { return []; }
}

function showRecords() {
  $('levelSelect').classList.remove('show');
  $('recordsScreen').classList.add('show');

  var data = getScores();
  var levels = ['Bronze','Silver','Gold','Platinum'];
  var levelIcon = {Bronze:'🥉',Silver:'🥈',Gold:'🥇',Platinum:'💎'};
  var levelClass = {Bronze:'bronze',Silver:'silver',Gold:'gold',Platinum:'plat'};

  // Best per level
  var bestDiv = $('recordsBest');
  bestDiv.innerHTML = '<div class="history-title">🌟 Best Scores</div><div class="best-grid" id="bestGrid"></div>';
  var grid = $('bestGrid');
  for (var li = 0; li < levels.length; li++) {
    var lv = levels[li];
    var best = null;
    for (var di = 0; di < data.length; di++) {
      if (data[di].level === lv) {
        if (best === null || data[di].pts > best) best = data[di].pts;
      }
    }
    var card = document.createElement('div');
    card.className = 'best-card ' + levelClass[lv];
    card.innerHTML = '<div class="bc-level">' + levelIcon[lv] + ' ' + lv + '</div>'
      + '<div class="bc-score">' + (best !== null ? best : '-') + '</div>'
      + '<div class="bc-label">' + (best !== null ? '/ 100 pts' : 'No record yet') + '</div>';
    grid.appendChild(card);
  }

  // Recent history (last 15)
  var histDiv = $('recordsHistory');
  histDiv.innerHTML = '<div class="history-title" style="margin-top:12px;">📋 Recent Games</div>';
  var recent = data.slice().reverse().slice(0, 15);
  if (recent.length === 0) {
    histDiv.innerHTML += '<div style="text-align:center;color:#aaa;font-size:0.9rem;margin-top:8px;">No games yet!</div>';
  } else {
    for (var ri = 0; ri < recent.length; ri++) {
      var r = recent[ri];
      var row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = '<span class="hi-level">' + levelIcon[r.level] + ' ' + r.level + '</span>'
        + '<span class="hi-pts">' + r.pts + '<span style="font-size:0.7rem;color:#aaa"> pts</span></span>'
        + '<span class="hi-date">' + r.date + '</span>';
      histDiv.appendChild(row);
    }
  }
}

function clearRecords() {
  try { localStorage.removeItem('sbScores'); } catch(e) {}
  showRecords();
}

function loadVoices() {
  if (!window.speechSynthesis) return;
  var voices = window.speechSynthesis.getVoices();
  gAllVoices = [];
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang.indexOf('en') === 0) gAllVoices.push(voices[i]);
  }
  // Default to Samantha
  gVoice = null;
  for (var j = 0; j < gAllVoices.length; j++) {
    if (gAllVoices[j].name.indexOf('Samantha') >= 0) { gVoice = gAllVoices[j]; break; }
  }
  if (!gVoice && gAllVoices.length > 0) gVoice = gAllVoices[0];
  buildVoicePicker();
}

function buildVoicePicker() {
  var sel = $('voiceSel');
  if (!sel) return;
  sel.innerHTML = '';
  for (var i = 0; i < gAllVoices.length; i++) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = gAllVoices[i].name;
    if (gVoice && gAllVoices[i].name === gVoice.name) opt.selected = true;
    sel.appendChild(opt);
  }
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 200);
}

function shuffle(arr) {
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showLevelSelect() {
  $('results').classList.remove('show');
  $('game').classList.add('hide');
  $('recordsScreen').classList.remove('show');
  $('levelSelect').classList.add('show');
}

function getNextBatch(level, batchSize) {
  var pool = WORD_LEVELS[level] || WORD_LEVELS.Bronze;
  var key = 'seen_' + level;
  var seen = [];
  try { seen = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  // Remove any words no longer in pool
  seen = seen.filter(function(w) { return pool.indexOf(w) >= 0; });
  // Remaining = not yet seen this cycle
  var remaining = pool.filter(function(w) { return seen.indexOf(w) < 0; });
  if (remaining.length < batchSize) {
    // Cycle complete (or nearly done) — reset and use full pool
    seen = [];
    remaining = pool.slice();
  }
  var batch = shuffle(remaining).slice(0, batchSize);
  var newSeen = seen.concat(batch);
  try { localStorage.setItem(key, JSON.stringify(newSeen)); } catch(e) {}
  return batch;
}

function startLevel(level) {
  gLevel = level;
  $('levelSelect').classList.remove('show');
  gWords = getNextBatch(level, 15);
  gIdx = 0; gScore = 0; gStreak = 0; gResults = [];
  $('game').classList.remove('hide');
  $('results').classList.remove('show');
  buildDots();
  buildKeyboard();
  loadWord();
}

function init() {
  showLevelSelect();
}

function buildDots() {
  var c = $('dots'), i, d;
  c.innerHTML = '';
  for (i = 0; i < 10; i++) {
    d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' cur' : '');
    d.id = 'dt' + i;
    c.appendChild(d);
  }
}

function buildKeyboard() {
  var kb = $('kb'), i, j, row, btn, label;
  kb.innerHTML = '';

  // Letter rows
  for (i = 0; i < KB.length; i++) {
    row = document.createElement('div');
    row.className = 'kb-row';
    for (j = 0; j < KB[i].length; j++) {
      label = KB[i][j];
      btn = document.createElement('button');
      btn.setAttribute('data-k', label);
      if (label === 'DEL') {
        btn.className = 'key del';
        btn.innerHTML = '&#9003;';
      } else {
        btn.className = 'key';
        btn.textContent = label.toUpperCase();
      }
      btn.addEventListener('mousedown',  tapHandler, false);
      btn.addEventListener('touchstart', tapHandler, {passive: false});
      row.appendChild(btn);
    }
    kb.appendChild(row);
  }

  // GO / NEXT row
  row = document.createElement('div');
  row.className = 'kb-row';
  btn = document.createElement('button');
  btn.id = 'goBtn';
  btn.className = 'key go';
  btn.setAttribute('data-k', 'GO');
  btn.textContent = 'GO!';
  btn.addEventListener('mousedown',  tapHandler, false);
  btn.addEventListener('touchstart', tapHandler, {passive: false});
  row.appendChild(btn);
  kb.appendChild(row);
}

function tapHandler(e) {
  e.preventDefault();
  pressKey(this.getAttribute('data-k'));
}

function pressKey(k) {
  // When done, tapping GO skips the countdown
  if (gDone) {
    if (k === 'GO') {
      if (gTimer) { clearTimeout(gTimer); gTimer = null; }
      nextWord();
    }
    return;
  }

  if (k === 'GO') {
    if (gTyped.length === gWords[gIdx].length) check();
    return;
  }

  if (k === 'DEL') {
    if (gCursor === 0) return;
    gCursor--;
    gTyped.pop();
    var box = $('ab' + gCursor);
    if (box) { box.textContent = ''; box.className = 'abox active'; }
    var nb = $('ab' + (gCursor + 1));
    if (nb) nb.classList.remove('active');
    return;
  }

  var w = gWords[gIdx];
  if (gCursor >= w.length) return;

  gTyped.push(k);
  var box = $('ab' + gCursor);
  if (box) { box.textContent = k; box.className = 'abox filled'; }
  gCursor++;

  var nb = $('ab' + gCursor);
  if (nb) nb.classList.add('active');
}

function loadWord() {
  if (gTimer) { clearTimeout(gTimer); gTimer = null; }
  gDone = false; gAttempts = 0; gTyped = []; gCursor = 0;
  var w = gWords[gIdx];

  $('sWord').textContent = (gIdx + 1) + '/10';
  $('fb').textContent = '';
  $('fb').className = 'feedback';
  resetStars();
  setKeysOff(false);
  setGoBtn('go');

  var cdBar = $('cdBar');
  if (cdBar) { cdBar.style.animation = 'none'; cdBar.style.transform = 'scaleX(0)'; }

  var ar = $('arow'), i, box;
  ar.innerHTML = '';
  ar.style.animation = 'slideIn 0.35s ease';
  for (i = 0; i < w.length; i++) {
    box = document.createElement('div');
    box.className = 'abox' + (i === 0 ? ' active' : '');
    box.id = 'ab' + i;
    ar.appendChild(box);
  }

  setTimeout(speak, 500);
}

function setGoBtn(mode) {
  var btn = $('goBtn');
  if (!btn) return;
  if (mode === 'go') {
    btn.className = 'key go';
    btn.textContent = 'GO!';
  } else {
    btn.className = 'key nxt';
    btn.textContent = 'NEXT';
  }
}

function setKeysOff(off) {
  var keys = document.querySelectorAll('.key:not(#goBtn)');
  var i;
  for (i = 0; i < keys.length; i++) {
    if (off) keys[i].classList.add('off');
    else keys[i].classList.remove('off');
  }
}

function speak() { speakWord(gWords[gIdx]); }

function speakWord(word) {
  try {
    if (!window.speechSynthesis) return;
    var sel = $('voiceSel');
    if (sel && sel.value !== '' && gAllVoices[sel.value]) {
      gVoice = gAllVoices[sel.value];
    }
    var u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.6;
    u.pitch = 1.1;
    if (gVoice) u.voice = gVoice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function check() {
  if (gDone) return;
  var w = gWords[gIdx];
  var typed = gTyped.join('');
  gAttempts++;

  if (typed === w) {
    gDone = true;
    var pts = (gAttempts === 1) ? 10 : 5;
    gScore += pts;
    if (gAttempts === 1) gStreak++; else gStreak = 0;
    gResults.push({word: w, pts: pts});

    var i, box;
    for (i = 0; i < w.length; i++) {
      box = $('ab' + i);
      if (box) box.className = 'abox correct';
    }

    lightStars(gAttempts === 1 ? 3 : 1);

    var defJa = (DEFS && DEFS[w]) ? DEFS[w] : '';
    $('fb').innerHTML = defJa ? '<span class="fb-def">' + defJa + '</span>' : '';
    $('fb').className = 'feedback ok';

    $('sScore').textContent  = gScore;
    $('sStreak').textContent = gStreak;

    markDot(gIdx, pts);
    setKeysOff(true);
    setGoBtn('go');
    if (pts === 10) confetti();
    startCountdown(false);

  } else {
    var i, box;
    for (i = 0; i < w.length; i++) {
      box = $('ab' + i);
      if (box) { box.className = 'abox wrong'; }
    }

    if (gAttempts >= 2) {
      gDone = true; gStreak = 0;
      gResults.push({word: w, pts: 0});
      $('sScore').textContent  = gScore;
      $('sStreak').textContent = gStreak;
      markDot(gIdx, 0);

      for (i = 0; i < w.length; i++) {
        box = $('ab' + i);
        if (box) { box.textContent = w[i]; box.className = 'abox wrong'; }
      }

      var defJa2 = (DEFS && DEFS[w]) ? DEFS[w] : '';
      $('fb').innerHTML = '\uD83D\uDC19 <b>' + w + '</b>' + (defJa2 ? ' &nbsp;<span class="fb-def">' + defJa2 + '</span>' : '');
      $('fb').className = 'feedback fail';
      setKeysOff(true);
      setGoBtn('go');
      startCountdown(true);

    } else {
      $('fb').textContent = 'Hmm, try again!';
      $('fb').className = 'feedback fail';
      gTyped = []; gCursor = 0;
      setTimeout(function() {
        var j, b;
        for (j = 0; j < w.length; j++) {
          b = $('ab' + j);
          if (b) { b.textContent = ''; b.className = 'abox' + (j === 0 ? ' active' : ''); }
        }
      }, 500);
    }
  }
}

function markDot(i, pts) {
  var d = $('dt' + i);
  if (d) {
    d.classList.remove('cur');
    d.classList.add(pts === 10 ? 'ok' : pts === 5 ? 'part' : 'miss');
  }
  var n = $('dt' + (i + 1));
  if (n) n.classList.add('cur');
}

function startCountdown(isFail) {
  var cdBar = $('cdBar');
  if (!cdBar) return;
  cdBar.className = 'countdown-bar' + (isFail ? ' fail' : '');
  cdBar.style.animation = 'none';
  cdBar.offsetWidth;
  cdBar.style.animation = 'shrink 1.3s linear forwards';
  gTimer = setTimeout(nextWord, 1350);
}

function nextWord() {
  gTimer = null;
  var ar = $('arow');
  if (ar) {
    ar.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(function() {
      gIdx++;
      if (gIdx >= 10) showResults();
      else loadWord();
    }, 300);
  } else {
    gIdx++;
    if (gIdx >= 10) showResults();
    else loadWord();
  }
}

function resetStars() {
  for (var i = 1; i <= 3; i++) {
    var s = $('st' + i);
    if (s) s.classList.remove('lit');
  }
}

function lightStars(n) {
  for (var i = 1; i <= n; i++) {
    (function(j){
      setTimeout(function() {
        var s = $('st' + j);
        if (s) s.classList.add('lit');
      }, j * 150);
    })(i);
  }
}

function showResults() {
  $('game').classList.add('hide');
  $('results').classList.add('show');

  var correct = 0, i, r;
  for (i = 0; i < gResults.length; i++) if (gResults[i].pts > 0) correct++;
  $('rScore').textContent = correct + '/10';
  $('rPoints').textContent = gScore + ' / 100 pts';
  saveScore(gLevel, gScore, correct);
  var t, s;
  if (correct === 10)    { t = 'Perfect Score!'; s = '\u2605\u2605\u2605'; }
  else if (correct >= 7) { t = 'Great Job!';     s = '\u2605\u2605'; }
  else if (correct >= 4) { t = 'Good Try!';      s = '\u2605'; }
  else                   { t = 'Keep Practicing!'; s = ''; }
  $('rTitle').textContent = t;
  $('rStars').textContent = s;

  // Build review for words with pts < 3
  var rev = $('review');
  rev.innerHTML = '';
  var reviewWords = [];
  for (i = 0; i < gResults.length; i++) {
    if (gResults[i].pts < 10) reviewWords.push(gResults[i]);
  }

  if (reviewWords.length > 0) {
    var title = document.createElement('div');
    title.className = 'review-title';
    title.textContent = "ふくしゅうしよう！";
    rev.appendChild(title);
    for (i = 0; i < reviewWords.length; i++) {
      (function(res) {
        var scoreEmoji = res.pts === 5 ? '\uD83C\uDF39' : '\uD83D\uDC19';
        var row = document.createElement('div');
        row.className = 'review-item';

        // Emoji card
        var imgWrap = document.createElement('div');
        imgWrap.className = 'review-img-wrap';
        imgWrap.textContent = EMOJIS[res.word] || scoreEmoji;

        // Info
        var info = document.createElement('div');
        info.className = 'review-info';
        var wordDiv = document.createElement('div');
        wordDiv.className = 'review-word';
        wordDiv.textContent = res.word.toUpperCase();
        var desc = document.createElement('div');
        desc.className = 'review-desc';
        desc.textContent = DEFS[res.word] || '';
        info.appendChild(wordDiv);
        info.appendChild(desc);

        // Listen button
        var btn = document.createElement('button');
        btn.className = 'review-listen';
        btn.innerHTML = '&#x1F50A;';
        btn.addEventListener('mousedown',  function(e) { e.preventDefault(); speakWord(res.word); });
        btn.addEventListener('touchstart', function(e) { e.preventDefault(); speakWord(res.word); }, {passive: false});

        row.appendChild(imgWrap);
        row.appendChild(info);
        row.appendChild(btn);
        rev.appendChild(row);
      })(reviewWords[i]);
    }
  }

  confetti();
}

function confetti() {
  var wrap = $('cw');
  var colors = ['#FFD200','#FF5252','#4CAF50','#2196F3','#FF9800','#E91E63'];
  var i;
  for (i = 0; i < 50; i++) {
    (function() {
      var p = document.createElement('div');
      p.style.position = 'absolute';
      p.style.width = '10px';
      p.style.height = '10px';
      p.style.left = (Math.random() * 100) + '%';
      p.style.top = '-15px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      var dur = (1.5 + Math.random() * 1.5).toFixed(2);
      var delay = (Math.random() * 0.8).toFixed(2);
      p.style.animation = 'fall ' + dur + 's ' + delay + 's ease-in forwards';
      wrap.appendChild(p);
      setTimeout(function() {
        if (p.parentNode) p.parentNode.removeChild(p);
      }, (parseFloat(dur) + parseFloat(delay) + 0.5) * 1000);
    })();
  }
}

init();
</script>
</body>
</html>
